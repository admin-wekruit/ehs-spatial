[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ehs-spatial"
version = "0.1.0"
description = "Single-process EHS visual-spatial assessment MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fal-client==1.0.0",
    "google-genai==2.11.0",
    "gradio==6.20.0",
    "modal>=1.5.4",
    "numpy==2.5.1",
    "open3d==0.19.0",
    "Pillow==12.3.0",
    "pydantic==2.13.4",
    "replicate==1.0.7",
    "shapely==2.1.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["ehs_spatial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
