[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ehs-spatial"
version = "0.1.0"
description = "Single-process EHS visual-spatial assessment MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fal-client==1.0.0",
    "google-genai==2.11.0",
    "gradio==6.20.0",
    "modal>=1.5.4",
    "numpy==2.5.1",
    "open3d==0.19.0",
    "Pillow==12.3.0",
    "pydantic==2.13.4",
    "replicate==1.0.7",
    "shapely==2.1.2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
    "pymongo>=4.6,<5",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30,<1",
    "zen-engine>=0.50,<1",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "mongomock>=4.1,<5", "moto[s3]>=5,<6"]
photo = ["opencv-python-headless==5.0.0.93", "scipy==1.18.0", "trimesh==5.1.0"]

[tool.setuptools.packages.find]
include = ["ehs_spatial*", "panoptes_worker*"]

[tool.setuptools.package-data]
ehs_spatial = ["surface_viewer.js", "static/*", "static/vendor/*"]
"ehs_spatial.platform" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
