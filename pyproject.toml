[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Capture-to-publication spatial inspection pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fal-client==1.0.0",
    "google-genai==2.11.0",
    "modal>=1.5.4",
    "numpy==2.5.1",
    "matplotlib==3.11.0",
    "open3d==0.19.0",
    "Pillow==12.3.0",
    "pydantic==2.13.4",
    "shapely==2.1.2",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
    "pymongo>=4.6,<5",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30,<1",
    "zen-engine>=0.50,<1",
    "pypdf>=6,<7",
    "opencv-python-headless==5.0.0.93",
    "scipy==1.18.0",
    "trimesh==5.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "mongomock>=4.1,<5", "moto[s3]>=5,<6"]

[project.scripts]
panoptes = "argus.pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
"argus.pipeline" = ["cells/*.json", "locales/en.json"]
"argus.providers" = ["sam3d_mesh_only.patch"]
"argus.platform" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
