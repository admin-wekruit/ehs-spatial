name: ci
on:
  push:
    branches: [main, staging]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: panoptes
          POSTGRES_PASSWORD: panoptes
          POSTGRES_DB: panoptes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U panoptes -d panoptes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PANOPTES_FAKE_MODEL: "1"
      HF_HUB_OFFLINE: "1"
      EHS_LIVE_BENCHMARK: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}
      PANOPTES_TEST_DATABASE_URL: postgresql://panoptes:panoptes@127.0.0.1:5432/panoptes_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra dev
          npm ci --prefix web
      - name: Source syntax and delivery boundaries
        run: |
          uv run python -m compileall -q argus scripts
          uv run python scripts/check_delivery.py
      - name: Retained offline tests
        run: make test
      - name: Viewer consumers and build
        run: |
          npm --prefix web run check
          npm --prefix web run build
