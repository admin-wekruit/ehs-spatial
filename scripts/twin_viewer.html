<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ME340 digital twin</title>
<style>
  :root { --bg: #15171a; --panel: rgba(28, 31, 36, .92); --text: #e8e8e8; --muted: #a0a4ab; --accent: #ffb000; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: absolute; top: 12px; left: 12px; max-width: min(340px, calc(100vw - 48px)); background: var(--panel);
           padding: 12px 14px; border-radius: 8px; }
  #panel h1 { font-size: 16px; margin: 0 0 4px; }
  #panel .warn { color: var(--accent); font-size: 12px; margin: 0 0 10px; }
  #panel label { display: flex; gap: 8px; align-items: center; margin: 5px 0; cursor: pointer; }
  #panel small, #status { color: var(--muted); font-size: 12px; }
  #info { position: absolute; right: 12px; bottom: 12px; max-width: min(360px, calc(100vw - 48px)); background: var(--panel);
          padding: 10px 12px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="panel">
  <h1>ME340 digital twin</h1>
  <p class="warn">Inferred stand-ins, not measurements. The observed layers are the evidence.</p>
  <label><input type="checkbox" id="twin" checked> Twin: stand-ins that passed verification</label>
  <label><input type="checkbox" id="rest"> Stand-ins that failed or could not be verified (red / orange)</label>
  <label><input type="checkbox" id="points"> Observed: dense points (LingBot)</label>
  <label><input type="checkbox" id="mesh"> Observed: textured mesh</label>
  <small>Drag to orbit, right-drag to pan, scroll to zoom. Click a stand-in for its numbers.</small>
  <div id="status"></div>
</div>
<div id="info"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6), Object.assign(new THREE.DirectionalLight(0xffffff, 1.4), { position: new THREE.Vector3(5, 10, 4) }));
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 500);
const controls = new OrbitControls(camera, renderer.domElement);
const status = document.getElementById("status"), info = document.getElementById("info");
const loader = new GLTFLoader(), layers = {};

// Every layer is metres, +Y up, origin on the floor plane (me340_twin_m).
async function layer(key, file, prepare) {
  if (!layers[key]) {
    status.textContent = `Loading ${file}...`;
    layers[key] = loader.loadAsync(file).then(gltf => { prepare?.(gltf.scene); scene.add(gltf.scene); status.textContent = ""; return gltf.scene; })
      .catch(error => { status.textContent = `Could not load ${file}: ${error.message}. Serve this folder over http (python3 -m http.server).`; delete layers[key]; });
  }
  return layers[key];
}
const toggle = (id, file, prepare) => {
  const box = document.getElementById(id);
  const apply = async () => { const root = await layer(id, file, prepare); if (root) root.visible = box.checked; };
  box.addEventListener("change", apply);
  if (box.checked) apply();
};
const meta = o => { for (let n = o; n; n = n.parent) if (n.userData?.panoptes) return n.userData.panoptes; };

toggle("twin", "twin.glb", root => {
  const box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
  controls.target.copy(centre);
  camera.position.copy(centre).add(new THREE.Vector3(size.x * .1, Math.max(size.y, 4) * 1.6, size.z * .9));
  controls.update();
});
toggle("rest", "twin-all.glb", root => root.traverse(o => {
  const m = meta(o);
  if (!o.isMesh || !m) return;
  if (m.status === "pass") { o.visible = false; return; }
  o.material = new THREE.MeshStandardMaterial({ color: m.status === "unverifiable" ? 0xff8c00 : 0xe60000, transparent: true, opacity: .55 });
}));
toggle("points", "observed-points.glb", root => root.traverse(o => {
  if (o.isPoints) o.material = new THREE.PointsMaterial({ size: 0.02, vertexColors: true });
}));
toggle("mesh", "observed-mesh.glb");

const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
let down;
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  pointer.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const roots = ["twin", "rest"].map(k => layers[k] && document.getElementById(k).checked ? k : null).filter(Boolean);
  Promise.all(roots.map(k => layers[k])).then(objects => {
    const hit = ray.intersectObjects(objects.filter(Boolean), true).find(h => h.object.visible && meta(h.object));
    const m = hit && meta(hit.object);
    info.style.display = m ? "block" : "none";
    if (!m) return;
    const v = m.verification || {}, s = v.summary || {};
    const f = x => x == null ? "-" : (+x).toFixed(3);
    info.textContent = [m.node, m.twinId ? `${m.category} | ${m.representation}` : m.kind, `status: ${m.status || v.status || "-"}` +
      (v.resolvedAtM ? ` (control resolves ${v.resolvedAtM} m)` : ""),
      s.iou != null ? `held-out IoU ${f(s.iou)} | depth rel ${f(s.depthRelMedian)} / p95 ${f(s.depthRelP95)} | views ${s.judgedViews}` : (v.depthRelMedian != null ? `depth rel ${f(v.depthRelMedian)}` : ""),
      m.dimSource ? `size from: ${Object.entries(m.dimSource).map(([k, x]) => `${k} ${x}`).join(", ")}` : "",
      "Inferred stand-in, not a measurement."].filter(Boolean).join("\n");
  });
});
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
