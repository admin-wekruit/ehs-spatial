<script>
'use strict';
// ponytail: one indexed scene contract with uint32 triangles; this is not a general GLB importer.
const add=(a,b)=>a.map((v,i)=>v+b[i]), scale=(a,s)=>a.map(v=>v*s), dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0), cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

const finite=(a,n)=>Array.isArray(a)&&a.length===n&&a.every(v=>typeof v==='number'&&Number.isFinite(v));
const matmul=(a,b)=>{const m=new Float64Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)m[c*4+r]+=a[k*4+r]*b[c*4+k];return m;};
function transformMatrix(t){

}
function normalMatrix(t){const m=transformMatrix(t);return new Float32Array([0,1,2,4,5,6,8,9,10].map(i=>m[i]/t.scale[Math.floor(i/4)]**2));}
const point=(m,p)=>[0,1,2].map(i=>m[i]*p[0]+m[4+i]*p[1]+m[8+i]*p[2]+m[12+i]);
function validateTransform(t){if(!t||!finite(t.position,3)||!finite(t.rotation_deg,3)||!finite(t.scale,3)||t.scale.some(v=>v<=0||v>1e6)||[...t.position,...t.rotation_deg].some(v=>Math.abs(v)>1e9))throw Error('对象变换必须为有限数值，缩放必须大于零。');}
function validateCamera(c){
  if(!c||typeof c.id!=='string'||typeof c.image!=='string'||!Number.isInteger(c.width)||!Number.isInteger(c.height)||c.width<=0||c.height<=0||!Array.isArray(c.K)||c.K.length!==3||!c.K.every(r=>finite(r,3))||c.K[0][0]<=0||c.K[1][1]<=0||Math.abs(c.K[1][0])>1e-8||c.K[2].some((v,i)=>Math.abs(v-(i===2?1:0))>1e-8))throw Error('无效相机内参');

  const axes=[0,1,2].map(i=>C.slice(0,3).map(r=>r[i]));for(let i=0;i<3;i++)for(let j=0;j<3;j++)if(Math.abs(dot(axes[i],axes[j])-(i===j?1:0))>1e-3)throw Error('相机旋转不是正交矩阵');if(dot(cross(axes[0],axes[1]),axes[2])<.999)throw Error('相机坐标手性无效');
}
function validateScene(s){
  if(!s||s.version!==1||typeof s.run_id!=='string'||!s.run_id||typeof s.units!=='string'||!finite(s.up,3)||Math.hypot(...s.up)<1e-8||!s.bounds||!finite(s.bounds.min,3)||!finite(s.bounds.max,3)||s.bounds.min.some((v,i)=>v>s.bounds.max[i])||!Array.isArray(s.cameras)||!s.cameras.length||!Array.isArray(s.objects)||!s.objects.length||s.objects.length>65534||s.binary!=='scene.bin')throw Error('不支持或不完整的场景格式');
  const ids=new Set(), cameras=new Set();s.cameras.forEach(c=>{validateCamera(c);if(cameras.has(c.id))throw Error('重复相机 ID');cameras.add(c.id);});
  s.objects.forEach(o=>{if(!o||typeof o.id!=='string'||!o.id||ids.has(o.id)||typeof o.label!=='string'||!['generated','observed'].includes(o.source)||!o.mesh||o.mesh.stride!==9||!Number.isSafeInteger(o.mesh.byte_offset)||o.mesh.byte_offset<0||o.mesh.byte_offset%4||!Number.isSafeInteger(o.mesh.vertex_count)||o.mesh.vertex_count<=0||o.mesh.vertex_count>4294967295||!Number.isSafeInteger(o.mesh.index_byte_offset)||o.mesh.index_byte_offset<0||o.mesh.index_byte_offset%4||!Number.isSafeInteger(o.mesh.index_count)||o.mesh.index_count<=0||o.mesh.index_count%3||o.mesh.index_type!=='uint32'||!Array.isArray(o.frame_ids)||o.frame_ids.some(id=>!cameras.has(id)))throw Error('无效对象/索引网格/来源帧');ids.add(o.id);validateTransform(o.transform);});

}
function readMeshes(s,buffer){
  const occupied=[];function span(start,bytes){const end=start+bytes;if(!Number.isSafeInteger(end)||end>buffer.byteLength)throw Error('scene.bin 网格或索引越界');if(occupied.some(([a,b])=>start<b&&end>a))throw Error('网格或索引数据区间重叠');occupied.push([start,end]);return new DataView(buffer,start,bytes);}
  return s.objects.map(o=>{const view=span(o.mesh.byte_offset,o.mesh.vertex_count*36),indexView=span(o.mesh.index_byte_offset,o.mesh.index_count*4);
    const data=new Float32Array(o.mesh.vertex_count*9),min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];for(let i=0;i<data.length;i++){const v=view.getFloat32(i*4,true);if(!Number.isFinite(v)||(i%9>=6&&(v<0||v>1)))throw Error('网格含非有限数值或无效颜色');data[i]=v;if(i%9<3){const k=i%9;min[k]=Math.min(min[k],v);max[k]=Math.max(max[k],v);}}

    return{data,indices,bounds:{min,max}};
  });
}
function importEdits(candidate,original){
  if(!candidate||candidate.version!==1||candidate.run_id!==original.run_id||!Array.isArray(candidate.objects)||candidate.objects.length!==original.objects.length)throw Error('只能导入当前 run 的同版本、同对象场景。');
  const wanted=new Set(original.objects.map(o=>o.id)),seen=new Set(),edits=new Map();candidate.objects.forEach(o=>{if(!o||!wanted.has(o.id)||seen.has(o.id)||('visible'in o&&typeof o.visible!=='boolean'))throw Error('导入对象 ID 或可见性不匹配。');seen.add(o.id);validateTransform(o.transform);edits.set(o.id,{transform:structuredClone(o.transform),visible:o.visible!==false});});return edits;
}
function sourceCamera(frame,radius,center){const C=frame.camera_to_world,eye=C.slice(0,3).map(r=>r[3]),forward=C.slice(0,3).map(r=>r[2]);return{eye,target:add(eye,scale(forward,Math.max(radius*.25,dot(add(center,scale(eye,-1)),forward)))),up:C.slice(0,3).map(r=>-r[1]),frame,exact:true};}
function cameraMatrix(camera,aspect,radius){
  const {eye,target,up,frame,exact}=camera,near=Math.max(radius*.0001,1e-6),far=Math.max(radius*100,near*1000);let P;
  if(exact){const K=frame.K,w=frame.width,h=frame.height;P=[2*K[0][0]/w,0,0,0,-2*K[0][1]/w,2*K[1][1]/h,0,0,1-2*(K[0][2]+.5)/w,2*(K[1][2]+.5)/h-1,-(far+near)/(far-near),-1,0,0,-2*far*near/(far-near),0];}
  else{const f=1/Math.tan(camera.fov/2);P=[f/aspect,0,0,0,0,f,0,0,0,0,-(far+near)/(far-near),-1,0,0,-2*far*near/(far-near),0];}
  const z=unit(add(eye,scale(target,-1))),x=unit(cross(up,z)),y=cross(z,x),V=[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1];return matmul(P,V);
}
const rotate=(v,a,t)=>add(add(scale(v,Math.cos(t)),scale(cross(a,v),Math.sin(t))),scale(a,dot(a,v)*(1-Math.cos(t))));
const boundsCorners=b=>Array.from({length:8},(_,n)=>[0,1,2].map(k=>(n>>k)&1?b.max[k]:b.min[k]));
function fitDistance(points,center,back,up,aspect,fov){
  const right=unit(cross(up,back)),vertical=cross(back,right),tanV=Math.tan(fov/2),tanH=tanV*aspect;let distance=1e-4;
  for(const world of points){const p=add(world,scale(center,-1));distance=Math.max(distance,dot(p,back)+1.08*Math.max(Math.abs(dot(p,right))/tanH,Math.abs(dot(p,vertical))/tanV));}return distance;
}
function localAsset(path,base){if(typeof path!=='string'||!path||/^[a-z][a-z0-9+.-]*:/i.test(path)||path.startsWith('//')||path.includes('\\'))throw Error('资源必须是同源相对路径');const u=new URL(path,base);if(u.origin!==location.origin)throw Error('禁止跨源资源');return u.href;}
const $=id=>document.getElementById(id);
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
async function main(){
  const parameter=new URLSearchParams(location.search).get('scene')||'scene.json',sceneURL=localAsset(parameter,location.href),response=await fetch(sceneURL);if(!response.ok)throw Error('scene.json 加载失败：'+response.status);const original=validateScene(await response.json()),scene=structuredClone(original);
  const binary=await fetch(localAsset(scene.binary,sceneURL));if(!binary.ok)throw Error('scene.bin 加载失败：'+binary.status);const meshes=readMeshes(scene,await binary.arrayBuffer());
  scene.cameras.forEach(c=>localAsset(c.image,sceneURL));scene.objects.forEach(o=>o.visible=o.visible!==false);
  const canvas=$('canvas'),gl=canvas.getContext('webgl',{antialias:false,alpha:false});if(!gl)throw Error('此浏览器无法创建 WebGL 场景。');if(!gl.getExtension('OES_element_index_uint'))throw Error('此浏览器不支持 uint32 网格索引（OES_element_index_uint）。');

  const fragment=`precision highp float;varying vec3 c;varying vec3 wn;uniform float selected;uniform float lighting;uniform float pick;uniform vec3 pickColor;void main(){if(pick>.5){gl_FragColor=vec4(pickColor,1.);return;}vec3 base=c;if(lighting>.5&&length(wn)>.001){float shade=.72+.28*abs(dot(normalize(wn),normalize(vec3(.3,.8,.5))));base*=shade;}if(selected>.5)base=mix(base,vec3(.2,.9,.8),.38);gl_FragColor=vec4(base,1.);}`;
  const program=gl.createProgram();for(const[type,code]of[[gl.VERTEX_SHADER,vertex],[gl.FRAGMENT_SHADER,fragment]]){const s=gl.createShader(type);gl.shaderSource(s,code);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));gl.attachShader(program,s);}gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.disable(gl.DITHER);
  const attributes=['p','n','color'].map(name=>gl.getAttribLocation(program,name)),u=Object.fromEntries(['vp','model','normal','selected','lighting','pick','pickColor'].map(n=>[n,gl.getUniformLocation(program,n)]));
  meshes.forEach(m=>{m.buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,m.buffer);gl.bufferData(gl.ARRAY_BUFFER,m.data,gl.STATIC_DRAW);m.indexBuffer=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,m.indexBuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,m.indices,gl.STATIC_DRAW);delete m.data;delete m.indices;});attributes.forEach(a=>gl.enableVertexAttribArray(a));
  let selected=-1,camera,drag,lastFrame=scene.cameras[0],dirty=false;const up=unit(scene.up);
  // Local bounds are cached while decoding; fitting visits eight points per object, never the full mesh.
  function worldCorners(index=null,includeHidden=false){return scene.objects.flatMap((o,i)=>(index!==null?i!==index:!includeHidden&&!o.visible)?[]:boundsCorners(meshes[i].bounds).map(p=>point(transformMatrix(o.transform),p)));}
  function worldBounds(index=null,includeHidden=false){const min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];for(const p of worldCorners(index,includeHidden))p.forEach((v,k)=>{min[k]=Math.min(min[k],v);max[k]=Math.max(max[k],v);});return Number.isFinite(min[0])?{min,max}:scene.bounds;}
  function dimensions(index=null){const b=worldBounds(index),center=b.min.map((v,i)=>(v+b.max[i])/2),radius=Math.max(Math.hypot(...b.min.map((v,i)=>b.max[i]-v))/2,1e-3);return{center,radius};}
  const initial=dimensions();let radius=initial.radius;
  function draw(pick=false){if(!camera)return;const panel=$('render-panel'),w=panel.clientWidth,h=panel.clientHeight;if(w<1||h<1)return;const ratio=camera.exact?camera.frame.width/camera.frame.height:w/h,cw=Math.min(w,h*ratio),ch=cw/ratio,dpr=Math.min(devicePixelRatio||1,2),pw=Math.max(1,Math.round(cw*dpr)),ph=Math.max(1,Math.round(ch*dpr));canvas.style.width=cw+'px';canvas.style.height=ch+'px';if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph;}if(camera.fit){const d=dimensions(camera.fit.index);radius=Math.max(d.radius,initial.radius*.05);camera.target=d.center;camera.eye=add(d.center,scale(camera.fit.back,fitDistance(worldCorners(camera.fit.index),d.center,camera.fit.back,camera.up,pw/ph,camera.fov)));}gl.viewport(0,0,pw,ph);gl.clearColor(.063,.09,.118,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.uniformMatrix4fv(u.vp,false,new Float32Array(cameraMatrix(camera,pw/ph,radius)));gl.uniform1f(u.pick,pick?1:0);gl.uniform1f(u.lighting,$('lighting').checked?1:0);
