<title>Panoptes 第五轮</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F4F1; --panel:#FFFFFF; --ink:#17201D; --muted:#56635F; --line:#D3DAD6;
  --accent:#0D7666; --accent-soft:#DCEEEA;
  --good:#2C7A4C; --good-bg:#E1F1E6; --warn:#9A6212; --warn-bg:#F6EBD6; --bad:#AE4136; --bad-bg:#F7E2DF;
  --run:#3B5BA5; --run-bg:#E3E9F6;
  --shadow:0 1px 2px rgba(20,32,29,.06);
  --f-display:"Barlow Condensed","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --f-body:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1513; --panel:#161F1C; --ink:#E2E9E6; --muted:#94A29D; --line:#2A3531;
    --accent:#47B7A4; --accent-soft:#15302B;
    --good:#62BE89; --good-bg:#16301F; --warn:#DDA650; --warn-bg:#33270F; --bad:#E57B6F; --bad-bg:#3A1D19;
    --run:#89A6EA; --run-bg:#1A2440; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1513; --panel:#161F1C; --ink:#E2E9E6; --muted:#94A29D; --line:#2A3531;
  --accent:#47B7A4; --accent-soft:#15302B;
  --good:#62BE89; --good-bg:#16301F; --warn:#DDA650; --warn-bg:#33270F; --bad:#E57B6F; --bad-bg:#3A1D19;
  --run:#89A6EA; --run-bg:#1A2440; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:44px}
h2{font-size:28px}
h3{font-size:21px}
p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:16px}
header{display:flex;flex-direction:column;gap:14px}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.good{color:var(--good);background:var(--good-bg)}
.warn{color:var(--warn);background:var(--warn-bg)}
.bad{color:var(--bad);background:var(--bad-bg)}
.run{color:var(--run);background:var(--run-bg)}
section{display:flex;flex-direction:column;gap:16px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
thead th{font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;background:transparent}
td.k{font-weight:600;white-space:nowrap}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1}
.cell{display:flex;flex-direction:column;gap:6px}
.sub{color:var(--muted);font-size:13px}
.note{color:var(--muted);font-size:13px}
.exp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start;border-top:1px solid var(--line);padding-top:22px}
.exp.wide{grid-template-columns:1fr}
.exp .text{display:flex;flex-direction:column;gap:10px}
.exp .head,.box .head{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
li{max-width:68ch}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figure img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
figcaption{color:var(--muted);font-size:12.5px}
.mini{min-width:0;font-size:13.5px}
.mini td,.mini th{padding:7px 10px}
.links{display:flex;flex-direction:column;gap:8px}
.links a{font-family:var(--f-mono);font-size:13px;color:var(--accent);word-break:break-all}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.tag{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){
  h1{font-size:34px}
  .exp,.two{grid-template-columns:1fr}
}
