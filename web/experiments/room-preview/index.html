<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 2 · 房间几何对照</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:#f6f6f0;color:#243b34;font:15px/1.55 system-ui,sans-serif}header,footer{padding:16px 24px}h1{margin:0;font-size:22px}p{margin:8px 0}small{color:#526960}button,select{font:inherit;padding:8px 12px;border:1px solid #b9c8bd;border-radius:5px;background:#fff;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#315b48;color:white}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #bb630e;outline-offset:2px}a{color:#315b48}nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.notice{padding:10px 24px;background:#fbefd8;border-block:1px solid #e1d4b5}.panels{display:grid;grid-template-columns:minmax(280px,36%) minmax(0,1fr);min-height:560px;height:calc(100vh - 265px);border-bottom:1px solid #bdc9bf}.panel{min-width:0;display:flex;flex-direction:column}.panel:first-child{border-right:1px solid #bdc9bf}.bar{padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:66px}.source{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#e5eae1;padding:12px}.source img{max-width:100%;max-height:100%;object-fit:contain}.stage{flex:1;min-height:360px}.count{padding:8px 16px;background:#eef1eb;min-height:40px}#status[role=alert]{color:#a6281c}footer{display:flex;gap:18px;flex-wrap:wrap;align-items:center}label{display:flex;gap:8px;align-items:center}@media(max-width:800px){.panels{display:flex;flex-direction:column;height:auto}.panel:first-child{border-right:0}.source{height:280px;flex:none}.stage{height:480px;flex:none}header,footer{padding:14px}.notice{padding:10px 14px}}
</style>
<header><h1>房间几何对照</h1><p id="summary">正在读取保存的重建结果…</p><small>原生点云与融合表面使用同一组预测坐标。拖动旋转 · Shift / 右键平移 · 滚轮缩放。</small></header>
<div class="notice">当前只有房间表面网格，尚未完成独立物体建模、人体模型或运动分离。点云中的错位也会影响模型；这些输出尚未通过空间精度验收。</div>
<main class="panels">
 <section class="panel" aria-label="来源照片"><div class="bar"><label>来源帧 <select id="frame" aria-label="来源帧"></select></label><span id="time"></span></div><div class="source"><img id="photo" alt="当前关键帧的原始 RGB 观测（模型输入分辨率）"></div><div class="count" id="source-count"></div></section>
 <section class="panel" aria-label="重建几何"><div class="bar"><nav aria-label="几何显示"><button id="cloud" aria-pressed="true">原生点云</button><button id="mesh" aria-pressed="false">表面网格模型</button></nav><label id="scope-label">点云范围 <select id="scope"><option value="all">全部帧叠加</option><option value="frame">仅当前帧</option></select></label><label>视角 <select id="view"><option value="free">自由 3D</option><option value="source">当前帧估计机位</option></select></label><button id="fit">适应画布</button></div><div id="stage" class="stage"></div><div id="status" class="count" role="status" aria-live="polite">正在载入几何…</div></section>
</main>
<footer><a id="ply" download>下载全量点云 PLY</a><a href="../room.glb" download>下载表面网格 GLB</a><a href="../native-cloud/manifest.json">点云来源与校验</a><small>数据：TUM RGB-D fr1/room · CC BY 4.0 · Sturm 等，IROS 2012。RGB 实验未使用传感器深度或真值位姿建图。</small></footer>
<script type="module" src="./room.ts"></script>
</html>
