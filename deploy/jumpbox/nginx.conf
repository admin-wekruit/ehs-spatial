# Jump VM reverse proxy (compose.nginx.yml): TLS on 8443, one location per model service, the request URI minus the prefix goes to
# the service root. X-API-Key is forwarded as received (nginx passes every client header by default; the services validate it).
# Service roots for .env with this proxy:
#   SAM3D_HTTP_URLS=https://10.21.72.251:8443/sam3d          GEOMETRY_MVS_HTTP_URLS=https://10.21.72.251:8443/geometry-mvs
#   SAM3_HTTP_URL=https://10.21.72.251:8443/sam3/sam3        GEOMETRY_HTTP_URL=https://10.21.72.251:8443/mapanything/geometry
#   MOGE_HTTP_URL=https://10.21.72.251:8443/moge/moge        (+ SSL_CERT_FILE / REQUESTS_CA_BUNDLE = the CA when it is private)
# gpu-a / gpu-b come from compose extra_hosts (GPU_A_IP / GPU_B_IP in deploy/jumpbox/.env).
server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/certs/jump.crt;
    ssl_certificate_key /etc/nginx/certs/jump.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512m;        # base64 photo + mask + pointmap (sam3d); every canonical frame of a run (geometry-mvs)
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;              # stream large results instead of spooling them to disk
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;          # synchronous POST /v1/<model> stays under ~60 s; long calls go through /v1/<model>/jobs + polling
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass_request_headers on;    # the default; stated so nobody "tidies" X-API-Key away

    location = /healthz {             # the jump itself (no key); the services' own /healthz are below their prefixes
        default_type application/json;
        return 200 '{"ok":true,"jump":"nginx"}\n';
    }

    # card A (deploy/compose.gpu-a.yml)
    location /sam3d/        { proxy_pass http://gpu-a:8805/; }
    location /sam3/         { proxy_pass http://gpu-a:8801/; }
    # card B (deploy/compose.gpu-b.yml)
    location /geometry-mvs/ { proxy_pass http://gpu-b:8804/; }
    location /mapanything/  { proxy_pass http://gpu-b:8802/; }
    location /moge/         { proxy_pass http://gpu-b:8803/; }
}
