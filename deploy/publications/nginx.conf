# Report website (compose.nginx.yml "web"): the Vite viewer bundle (app.html, assets/), measurement-layer/<publicationId>.json
# (+ its mesh files) and /api/ proxied to the publication service. The bundle is built once with VITE_API_ORIGIN='' (same origin)
# and VITE_PUBLICATION_ID=/ (lands on the report library), so one bundle serves every publication under any hostname, no CORS.
# Copied from ehs-spatial/containers/onprem/nginx.conf; "publications" is the compose service name.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index app.html;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    # Docker's embedded DNS: with the upstream in a variable nginx looks "publications" up per request (cached 10 s), so it starts
    # while publications is still down (502 until then) and follows a restarted container's new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $publications http://publications:8793;
        proxy_pass $publications;         # no URI part: /api/... with its query is passed unchanged
        proxy_set_header Host $host;
        proxy_buffering off;              # stream meshes / point clouds
        proxy_read_timeout 300s;
        client_max_body_size 1m;          # visitor feedback posts only
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /measurement-layer/ {
        add_header Cache-Control "no-cache";
    }
    location = /app.html {
        add_header Cache-Control "no-cache";
    }
}
